name: Build Xattot IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: |
          xcodebuild -project Xattot.xcodeproj -scheme Xattot -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath build/DerivedData
          APP=$(find build/DerivedData -name "Xattot.app" | head -n1)
          echo "APP=$APP"
          mkdir -p build/Payload
          cp -r "$APP" build/Payload/
          cd build && zip -r ../Xattot.ipa Payload
          ls -lh ../Xattot.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Xattot-IPA
          path: Xattot.ipa
          
