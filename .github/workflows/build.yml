name: Build Xattot IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app; xcodebuild -version
      - name: List files
        run: ls -R; echo "---"; find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -20
      - name: Build Real App
        run: |
          set -e
          mkdir -p build/Payload
          PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n1)
          echo "Project: $PROJ"
          # List schemes
          xcodebuild -list -project "$PROJ" || true
          # Build - do NOT create fake placeholder, real binary is required for Sideloadly
          xcodebuild -project "$PROJ" -scheme Xattot -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -derivedDataPath build/DerivedData
          APP=$(find build/DerivedData -name "Xattot.app" | head -n1)
          echo "App found: $APP"
          if [ -z "$APP" ]; then echo "ERROR: No Xattot.app built"; find build -type f | head -n 100; exit 1; fi
          # Check executable is real Mach-O, not shell script
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          echo "Executable: $EXEC"
          file "$APP/$EXEC"
          ls -lh "$APP/"
          # If PlugIns exists (keyboard extension), show it
          ls -R "$APP/PlugIns" || true
          cp -r "$APP" build/Payload/
          cd build && zip -r ../Xattot.ipa Payload
          ls -lh ../Xattot.ipa
          unzip -l ../Xattot.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Xattot-IPA
          path: Xattot.ipa
